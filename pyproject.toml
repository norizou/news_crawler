[project]
name = "ai-scraper"
version = "0.1.0"
description = "AI Trend & Tech News Scraping System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "asain" }]
keywords = ["ai", "scraper", "crawler", "news", "playwright", "scrapy"]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "feedparser>=6.0.10",
    "httpx>=0.27.0",
    "lxml>=5.1.0",
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "scrapy>=2.11.0",
    "scrapy-playwright>=0.0.34",
]

[project.scripts]
ai-scraper = "ai_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_scraper"]

[dependency-groups]
dev = [
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.23.1",
    "ruff>=0.3.0",
    "types-python-dateutil>=2.8.19",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "playwright.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
