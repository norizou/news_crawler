crawler:
  download_delay: 1.5
  concurrent_requests: 4
  user_agent: "AI-Scraper/1.0 (+https://gitlab.dell.com/asain/ai_scraper)"
  timeout_seconds: 30
  retry_times: 3
  retry_http_codes:
    - 500
    - 502
    - 503
    - 504
    - 408
    - 429
  database_path: "data/articles.db"
  output_dir: "output"

report:
  visualize: true
  top_n: 20
  japanese_font_path: ""
  output_assets_name: "assets"
  wordcloud_width: 800
  wordcloud_height: 400
  ai_keywords_path: "config/keiba_keywords.yaml"
  sudachi_config_path: "config/sudachi.json"

ai:
  enabled: true
  proxy_url: "http://localhost:11434/v1"
  model: "llama-3-3-70b-instruct"
  request_interval: 2.0
  timeout_seconds: 60
  max_retries: 3
  max_input_chars: 8000
  max_articles_per_run: 50
  prompt_version: "1"
  system_prompt: |
    You are a professional translator and summarizer. Your task is to process the provided article and output a JSON object with the following structure:

    {
      "title_ja": "Japanese translation of the article title",
      "summary_ja": "Japanese summary of the article content (2-3 sentences)"
    }

    Important guidelines:
    - Translate the title accurately to Japanese
    - Create a concise summary in Japanese (2-3 sentences)
    - If the article is already in Japanese, still provide a refined Japanese summary
    - Output ONLY the JSON object, no additional text
    - Ensure the JSON is valid and properly formatted
