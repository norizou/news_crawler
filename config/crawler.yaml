crawler:
  download_delay: 1.5
  concurrent_requests: 4
  user_agent: "News-Crawler/1.0 (+https://gitlab.dell.com/asain/news_crawler)"
  timeout_seconds: 30
  retry_times: 3
  retry_http_codes:
    - 500
    - 502
    - 503
    - 504
    - 408
    - 429
  database_path: "data/articles.db"
  output_dir: "output"

report:
  visualize: true
  top_n: 20
  japanese_font_path: ""
  output_assets_name: "assets"
  wordcloud_width: 800
  wordcloud_height: 400
  ai_keywords_path: "config/ai_keywords.yaml"

ai:
  enabled: true
  # 使うLLMは endpoint_order の先頭から順に試し、最初に到達できて対象モデルがロード済みのものを使う。
  # 特定の1つだけ使うとき: uv run news-crawler enrich --llm local_ollama
  endpoint_order: [local_ollama]
  endpoints:
    - name: local_ollama
      proxy_url: "http://localhost:11434/v1"
      model: "GPT-OSS-20B"
      max_tokens: 1000
  # 下2行は endpoints 未使用時の単一エンドポイント設定（後方互換）
  proxy_url: "http://localhost:11434/v1"
  model: "GPT-OSS-20B"
  request_interval: 2.0
  timeout_seconds: 60
  max_retries: 3
  max_input_chars: 8000
  max_articles_per_run: 50
  max_tokens: 1000
  prompt_version: "1"
  system_prompt: |
    You are a professional translator and summarizer. Your task is to process the provided article and output a JSON object with the following structure:

    {
      "title_ja": "Japanese translation of the article title",
      "summary_ja": "Japanese summary of the article content (2-3 sentences)",
      "keywords": ["keyword1", "keyword2", "keyword3"]
    }

    Important guidelines:
    - Translate the title accurately to Japanese
    - Create a concise summary in Japanese (2-3 sentences)
    - If the article is already in Japanese, still provide a refined Japanese summary
    - Extract 3-5 key AI/technology keywords from the article (e.g., model names, techniques, companies, frameworks). Include both English and Japanese terms if relevant.
    - Output ONLY the JSON object, no additional text
    - Ensure the JSON is valid and properly formatted
