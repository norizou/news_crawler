crawler:
  download_delay: 1.5
  concurrent_requests: 4
  user_agent: "News-Crawler/1.0 (+https://gitlab.dell.com/asain/news_crawler)"
  timeout_seconds: 30
  retry_times: 3
  retry_http_codes:
    - 500
    - 502
    - 503
    - 504
    - 408
    - 429
  database_path: "data/articles.db"
  output_dir: "output"

report:
  output_dir: "/Users/norihito/Library/Mobile Documents/iCloud~md~obsidian/Documents/10_KEIBA/news_crawl"
  visualize: true
  top_n: 20
  japanese_font_path: ""
  output_assets_name: "assets"
  wordcloud_width: 800
  wordcloud_height: 400
  ai_keywords_path: "config/keiba_keywords.yaml"
  sudachi_config_path: "config/sudachi.json"
  crowns_path: "config/keiba_crowns.csv"

ai:
  enabled: true
  # 使うLLMは endpoint_order の先頭から順に試し、最初に到達できて対象モデルがロード済みのものを使う。
  # 特定の1つだけ使うとき: uv run news-crawler enrich --llm gemini
  endpoint_order: [lmstudio_12b, lmstudio_local]
  endpoints:
    - name: lmstudio_12b
      proxy_url: "http://localhost:1234/v1"
      model: "google/gemma-4-12b-qat"
    - name: lmstudio_local
      proxy_url: "http://localhost:1234/v1"
      model: "google/gemma-4-e4b"
    - name: gemini            # 既定の順序には入れない（外部送信・従量課金のため --llm gemini で明示指定）
      proxy_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      model: "gemini-2.5-flash-lite"
      api_key_env: GEMINI_API_KEY   # .env に GEMINI_API_KEY=... を書く（.env は gitignore 済み）
      max_tokens: 1000
  # 下2行は endpoints 未使用時の単一エンドポイント設定（後方互換）
  proxy_url: "http://localhost:1234/v1"
  model: "google/gemma-4-e4b"
  request_interval: 2.0
  timeout_seconds: 60
  max_retries: 3
  max_input_chars: 8000
  max_articles_per_run: 50
  max_tokens: 3000  # gemma-4 は思考トークンも消費するため大きめに
  prompt_version: "1"
  system_prompt: |
    You are a professional translator and summarizer. Your task is to process the provided article and output a JSON object with the following structure:

    {
      "title_ja": "Japanese translation of the article title",
      "summary_ja": "Japanese summary of the article content (2-3 sentences)"
    }

    Important guidelines:
    - Translate the title accurately to Japanese
    - Create a concise summary in Japanese (2-3 sentences)
    - If the article is already in Japanese, still provide a refined Japanese summary
    - Output ONLY the JSON object, no additional text
    - Ensure the JSON is valid and properly formatted
