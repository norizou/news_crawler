# 競馬ニュース収集ソース設定 (Mac 自宅用)
# fetch_method: rss | html | playwright

title: "競馬ニュース動向レポート"
tags:
  - keiba
  - news
  - report

sources:
  # =====================
  # RSS / Atom フィード
  # =====================
  netkeiba:
    name: "netkeiba ニュース＆コラム"
    category: "media"
    fetch_method: "rss"
    enabled: true
    base_url: "https://www.netkeiba.com/"
    feed_url: "https://rss.netkeiba.com/?pid=rss_netkeiba&site=netkeiba"
    list_url: "https://news.netkeiba.com/"

  nikkansports:
    name: "日刊スポーツ 競馬"
    category: "sports_paper"
    fetch_method: "rss"
    enabled: true
    base_url: "https://www.nikkansports.com/keiba/"
    feed_url: "https://www.nikkansports.com/keiba/atom.xml"
    list_url: "https://www.nikkansports.com/keiba/"

  google_news_keiba:
    name: "Google News (競馬)"
    category: "aggregator"
    fetch_method: "rss"
    enabled: false # 同一記事を多数の再配信サイト名義で重複配信するため無効化（2026-09-18）
    base_url: "https://news.google.com/"
    feed_url: "https://news.google.com/rss/search?q=%E7%AB%B6%E9%A6%AC&hl=ja&gl=JP&ceid=JP:ja"
    list_url: "https://news.google.com/search?q=競馬&hl=ja&gl=JP&ceid=JP:ja"

  google_news_jra:
    name: "Google News (JRA)"
    category: "aggregator"
    fetch_method: "rss"
    enabled: false # 同一記事を多数の再配信サイト名義で重複配信するため無効化（2026-09-18）
    base_url: "https://news.google.com/"
    feed_url: "https://news.google.com/rss/search?q=JRA&hl=ja&gl=JP&ceid=JP:ja"
    list_url: "https://news.google.com/search?q=JRA&hl=ja&gl=JP&ceid=JP:ja"

  # =====================
  # HTML スクレイプ (Scrapy相当: 静的HTML)
  # =====================
  jra:
    name: "JRA 公式ニュース"
    category: "official"
    fetch_method: "html"
    enabled: true
    base_url: "https://www.jra.go.jp/"
    list_url: "https://www.jra.go.jp/news/"
    article_list_selector: "div.news_line a"
    title_selector: ".news_title h1"
    content_selector: ".news_body"
    date_selector: ".news_title p.date"
    encoding: "shift_jis" # jra.go.jp は Shift_JIS (HTTPヘッダにcharset無し)

  radionikkei:
    name: "ラジオNIKKEI 競馬実況Web"
    category: "media"
    fetch_method: "html"
    enabled: true
    base_url: "https://www.radionikkei.jp/"
    list_url: "https://www.radionikkei.jp/keiba/"
    article_list_selector: "a[href^='/keiba_article/news/']"
    title_selector: "h2.proglam-article-title"
    content_selector: ".article-box"
    date_selector: "time.articles-time"

  sponichi:
    name: "スポニチ競馬Web"
    category: "sports_paper"
    fetch_method: "html"
    enabled: true
    base_url: "https://keiba.sponichi.co.jp/"
    list_url: "https://keiba.sponichi.co.jp/"
    article_list_selector: "a[href^='/news/2']"
    title_selector: "h1.title-main-heading"
    content_selector: ".article-topics-paragraph"
    date_selector: ".title-main-date"

  sanspo:
    name: "サンスポZBAT! 中央競馬"
    category: "sports_paper"
    fetch_method: "html"
    enabled: true
    base_url: "https://www.sanspo.com/"
    list_url: "https://www.sanspo.com/race/keiba/"
    article_list_selector: "a[href^='/race/article/']"
    title_selector: "h1.article-headline"
    content_selector: "div.article-body"
    date_selector: "time[datetime]"

  keibalab:
    name: "競馬ラボ"
    category: "media"
    fetch_method: "html"
    enabled: true
    base_url: "https://keibalab.jp/"
    list_url: "https://keibalab.jp/"
    # bbs.html（コメント欄）・backnumber.html・IDなしの "/topics/" は記事ではないため除外
    article_list_selector: "a[href^='/topics/']:not([href$='bbs.html']):not([href*='backnumber']):not([href='/topics/'])"
    title_selector: "h1.heading02"
    content_selector: "div.post"
    date_selector: ".date.clear.tR"

  # =====================
  # Playwright (JS描画が必要)
  # =====================
  tospo:
    name: "東スポ競馬"
    category: "sports_paper"
    fetch_method: "playwright"
    enabled: true
    base_url: "https://tospo-keiba.jp/"
    list_url: "https://tospo-keiba.jp/news"
    article_list_selector: "a[href*='/breaking_news/']"
    title_selector: "h1.single-ttl"
    content_selector: "div.article-content-main"
    date_selector: "div.single-date"

  # =====================
  # 無効化 (必要に応じて有効化)
  # =====================
  kaba_tsu_jra:
    name: "TSL JRA指数予想"
    category: "prediction"
    fetch_method: "rss"
    enabled: false
    base_url: "https://jra.k-ba.net/"
    feed_url: "https://jra.k-ba.net/rss.rdf"
